<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xxavvTechnologies Issue Tracker</title>
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="nav-header">
            <h2>xxavvTechnologies</h2>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Issue Tracker</a>
                <a href="admin/index.html" class="nav-link">Admin Panel</a>
                <a href="help.html" class="nav-link">Help</a>
            </div>
        </nav>

        <header>
            <h1>xxavvTechnologies Issue Tracker</h1>
        </header>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Search issues by title or description...">
            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="open">Open Issues</option>
                <option value="in-progress">In Progress</option>
                <option value="closed">Closed Issues</option>
            </select>
            <select id="priorityFilter">
                <option value="all">All Priorities</option>
                <option value="high">High Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="low">Low Priority</option>
            </select>
        </div>

        <div id="issuesList" class="issues-list">
            <!-- Enhanced loading state will be added here -->
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
