<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xxavvTechnologies Admin</title>
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>xxavvTechnologies Admin</h1>
        </header>

        <div id="loginSection" class="login-section">
            <button id="googleLogin" class="btn-login">Login with Google</button>
        </div>

        <div id="adminPanel" class="admin-panel hidden">
            <div class="admin-header">
                <h2>Welcome, <span id="userName"></span></h2>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>

            <div class="admin-stats">
                <div class="stat-card">
                    <h4>Total Issues</h4>
                    <div id="totalIssues" class="stat-number">0</div>
                </div>
                <div class="stat-card">
                    <h4>Open Issues</h4>
                    <div id="openIssues" class="stat-number">0</div>
                </div>
                <div class="stat-card">
                    <h4>In Progress</h4>
                    <div id="inProgressIssues" class="stat-number">0</div>
                </div>
                <div class="stat-card">
                    <h4>Closed Issues</h4>
                    <div id="closedIssues" class="stat-number">0</div>
                </div>
            </div>

            <div class="issue-form">
                <div class="issue-form-main">
                    <h3>Create New Issue</h3>
                    <form id="newIssueForm">
                        <input type="text" id="issueTitle" placeholder="Issue Title" required>
                        <textarea id="issueDescription" placeholder="Description" required></textarea>
                        <select id="issuePriority" required>
                            <option value="high">High Priority</option>
                            <option value="medium">Medium Priority</option>
                            <option value="low">Low Priority</option>
                        </select>
                        <button type="submit" class="btn-submit">Create Issue</button>
                    </form>
                </div>
                <div class="issue-form-sidebar">
                    <h4>Tips</h4>
                    <p class="markdown-supported">✨ Markdown supported in description</p>
                    <p>Use clear and concise titles</p>
                    <p>Include steps to reproduce for bugs</p>
                </div>
            </div>

            <div class="issues-management">
                <h3>Manage Issues</h3>
                <div class="admin-toolbar">
                    <select id="sortIssues" class="sort-select">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="priority">Priority</option>
                        <option value="status">Status</option>
                    </select>
                    <div class="quick-filters">
                        <button class="quick-filter active" data-filter="all">All</button>
                        <button class="quick-filter" data-filter="open">Open</button>
                        <button class="quick-filter" data-filter="high">High Priority</button>
                    </div>
                </div>
                <div id="adminIssuesList" class="issues-list admin-list"></div>
            </div>
        </div>

        <div id="toast" class="toast"></div>
    </div>

    <script type="module" src="../firebase-config.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
